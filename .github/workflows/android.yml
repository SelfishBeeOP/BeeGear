name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Get App Version
        id: get_version
        run: |
          VERSION=$(grep -oP 'versionName\s*=?\s*["'\'']\K[^"'\'']+' app/build.gradle* | head -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BeeGear-v${{ steps.get_version.outputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}-${{ github.run_number }}
          name: BeeGear Release v${{ steps.get_version.outputs.version }} (Build ${{ github.run_number }})
          files: app/build/outputs/apk/debug/BeeGear-v${{ steps.get_version.outputs.version }}.apk
